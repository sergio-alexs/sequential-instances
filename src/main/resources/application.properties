spring.application.name=sequential-instances

# Apagado limpio en Kubernetes: permite que los hooks @PreDestroy completen antes de matar el proceso
server.shutdown=graceful

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/sequential-instances
spring.data.mongodb.auto-index-creation=true

# Heartbeat: intervalo de envío (ms) - 15s para no saturar MongoDB
instance.heartbeat-interval-ms=15000

# Expiración: tiempo sin heartbeat para considerar muerta (ms) - 45s (3 latidos perdidos)
instance.expiry-threshold-ms=45000

# Revisión periódica de expirados (cada 60s)
instance.expiry-check-interval-ms=60000

# Prefijo para el identificador de proceso (proceso_cre_1, proceso_cre_2...)
instance.process-prefix=proceso_cre_

# Reintentos de registro ante conflictos de concurrencia
instance.max-registration-retries=10

# Días de retención de registros INACTIVE antes de ser eliminados
instance.cleanup-retention-days=7

# Intervalo de limpieza de registros obsoletos (cada 6 horas)
instance.cleanup-interval-ms=21600000

# Actuator: mostrar detalles del health check
management.endpoint.health.show-details=always
